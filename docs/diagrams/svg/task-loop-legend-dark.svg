FMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e89960" letter-spacing="0.08em">WHO DOES IT</text><text x="40" y="736" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#fafafa">sdd-implementation-orchestrator</text><text x="260.6" y="736" font-family="Geist, 'Geist Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#ababab">works the task queue, opens the PR</text><text x="40" y="754" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#fafafa">sdd-implementer</text><text x="260.6" y="754" font-family="Geist, 'Geist Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#ababab">implements one task or fix, commits</text><text x="505.95000000000005" y="736" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#fafafa">sdd-verifier</text><text x="726.5500000000001" y="736" font-family="Geist, 'Geist Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#ababab">independent review, end-to-end checks</text><text x="505.95000000000005" y="754" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#fafafa">sdd-adjudicator</text><text x="726.5500000000001" y="754" font-family="Geist, 'Geist Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#ababab">rules on deadlocks, fixes what it accepts</text></svg>