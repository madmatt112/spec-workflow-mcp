xt x="1327" y="368" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#ababab">sdd-document-orchestrator</text><rect x="295" y="180" width="200" height="60" rx="14" fill="none" stroke="#ff6467" stroke-width="1.4" stroke-dasharray="5 3"/><text x="395" y="201" font-family="Geist, 'Geist Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#ff6467" text-anchor="middle">Stop and escalate</text><text x="395" y="218" font-family="Geist, 'Geist Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#ababab" text-anchor="middle" font-style="italic">Security, secrets, data loss,</text><text x="395" y="231" font-family="Geist, 'Geist Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#ababab" text-anchor="middle" font-style="italic">money, legal</text></svg>