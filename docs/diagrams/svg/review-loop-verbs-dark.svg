="200" height="34" rx="6" fill="#0e212e" stroke="#52b5f4" stroke-width="1" class="chip"/><rect x="40" y="318" width="3" height="34" rx="0" fill="#52b5f4"/><text x="52" y="338" font-family="Geist, 'Geist Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#fafafa">Draft v1</text><rect x="295" y="318" width="200" height="34" rx="6" fill="#0e212e" stroke="#52b5f4" stroke-width="1" class="chip"/><rect x="295" y="318" width="3" height="34" rx="0" fill="#52b5f4"/><text x="307" y="338" font-family="Geist, 'Geist Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#fafafa">Request approval for vN</text><rect x="550" y="318" width="200" height="50" rx="6" fill="#0e212e" stroke="#52b5f4" stroke-width="1" class="chip"/><rect x="550" y="318" width="3" height="50" rx="0" fill="#52b5f4"/><text x="562" y="338" font-family="Geist, 'Geist Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#fafafa">Adversarial review,</text><text x="562" y="354" font-family="Geist, 'Geist Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#fafafa">round N</text><path d="M905 318 L970 346 L905 374 L840 346 z" fill="#262626" stroke="#ababab" stroke-width="1.2"/><text x="905" y="350" font-family="Geist, 'Geist Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#fafafa" text-anchor="middle">Verdict?</text><rect x="805" y="456" width="200" height="64" rx="6" fill="#0e212e" stroke="#52b5f4" stroke-width="1" class="chip"/><rect x="805" y="456" width="3" height="64" rx="0" fill="#52b5f4"/><text x="817" y="476" font-family="Geist, 'Geist Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#fafafa">Standoff? Rule on it</text><text x="817" y="494" font-family="Geist, 'Geist Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#ababab" font-style="italic">A recurring MUST_FIX rejected</text><text x="817" y="507" font-family="Geist, 'Geist Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#ababab" font-style="italic">twice running</text><rect x="550" y="456" width="200" height="34" rx="6" fill="#0e212e" stroke="#52b5f4" stroke-width="1" class="chip"/><rect x="550" y="456" width="3" height="34" rx="0" fill="#52b5f4"/><text x="562" y="476" font-family="Geist, 'Geist Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#fafafa">Revise to v(N+1)</text><rect x="805" y="180" width="200" height="64" rx="6" fill="#0e212e" stroke="#52b5f4" stroke-width="1" class="chip"/><rect x="805" y="180" width="3" height="64" rx="0" fill="#52b5f4"/><text x="817" y="200" font-family="Geist, 'Geist Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#fafafa">Corrective pass, v10</text><text x="817" y="218" font-family="Geist, 'Geist Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#ababab" font-style="italic">Only when v9 still has open</text><text x="817" y="231" font-family="Geist, 'Geist Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#ababab" font-style="italic">items</text><rect x="1060" y="180" width="200" height="34" rx="6" fill="#0e212e" stroke="#52b5f4" stroke-width="1" class="chip"/><rect x="1060" y="180" width="3" height="34" rx="0" fill="#52b5f4"/><text x="1072" y="200" font-family="Geist, 'Geist Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#fafafa">Narrow check</text><rect x="1060" y="318" width="200" height="50" rx="6" fill="#0e212e" stroke="#52b5f4" stroke-width="1" class="chip"/><rect x="1060" y="318" width="3" height="50" rx="0" fill="#52b5f4"/><text x="1072" y="338" font-family="Geist, 'Geist Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#fafafa">Approve the final</text><text x="1072" y="354" font-family="Geist, 'Geist Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#fafafa">version</text><rect x="1315" y="318" width="200" height="50" rx="6" fill="#0e212e" stroke="#52b5f4" stroke-width="1" class="chip"/><rect x="1315" y="318" width="3" height="50" rx="0" fill="#52b5f4"/><text x="1327" y="338" font-family="Geist, 'Geist Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#fafafa">Prune records, delete</text><text x="1327" y="354" font-family="Geist, 'Geist Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#fafafa">prompts, commit</text><rect x="295" y="180" width="200" height="60" rx="14" fill="none" stroke="#ff6467" stroke-width="1.4" stroke-dasharray="5 3"/><text x="395" y="201" font-family="Geist, 'Geist Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#ff6467" text-anchor="middle">Stop and escalate</text><text x="395" y="218" font-family="Geist, 'Geist Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#ababab" text-anchor="middle" font-style="italic">Security, secrets, data loss,</text><text x="395" y="231" font-family="Geist, 'Geist Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#ababab" text-anchor="middle" font-style="italic">money, legal</text></svg>