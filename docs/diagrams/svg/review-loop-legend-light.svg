<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1555 646" width="1555" height="646" role="img" aria-labelledby="t d" font-family="Geist, 'Geist Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">The adversarial review loop</title><desc id="d">One document, one phase, up to ten versions.</desc>
<defs><marker id="arr-0a0a0a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#0a0a0a"/></marker><marker id="arr-636363" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#636363"/></marker><marker id="arr-c20000" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#c20000"/></marker><marker id="arr-0070b0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#0070b0"/></marker></defs>
