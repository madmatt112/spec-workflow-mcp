d="M905 456 L905 473 L750 473" fill="none" stroke="#0a0a0a" stroke-width="1.5" marker-end="url(#arr-0a0a0a)" stroke-linejoin="round"/><path d="M550 473 L395 473 L395 352" fill="none" stroke="#0070b0" stroke-width="1.5" marker-end="url(#arr-0070b0)" stroke-linejoin="round"/><rect x="438.8" y="457" width="67.4" height="14" rx="3" fill="#ffffff"/><text x="472.5" y="467" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#0070b0" text-anchor="middle">N = N + 1</text><path d="M905 318 L905 244" fill="none" stroke="#0a0a0a" stroke-width="1.5" marker-end="url(#arr-0a0a0a)" stroke-linejoin="round"/><rect x="909" y="275" width="100.39999999999999" height="14" rx="3" fill="#ffffff"/><text x="913" y="285" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#636363" text-anchor="start">iterate, N = 9</text><path d="M905 180 L905 197 L1060 197" fill="none" stroke="#0a0a0a" stroke-width="1.5" marker-end="url(#arr-0a0a0a)" stroke-linejoin="round"/><path d="M1160 214 L1160 318" fill="none" stroke="#0a0a0a" stroke-width="1.5" marker-end="url(#arr-0a0a0a)" stroke-linejoin="round"/><rect x="1164" y="260" width="47.6" height="14" rx="3" fill="#ffffff"/><text x="1168" y="270" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#636363" text-anchor="start">always</text><path d="M1260 343 L1315 343" fill="none" stroke="#0a0a0a" stroke-width="1.5" marker-end="url(#arr-0a0a0a)" stroke-linejoin="round"/><path d="M650 318 L650 210 L495 210" fill="none" stroke="#c20000" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arr-c20000)" stroke-linejoin="round"/><rect x="542.1" y="194" width="60.8" height="14" rx="3" fill="#ffffff"/><text x="572.5" y="204" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#c20000" text-anchor="middle">ESCALATE</text><rect x="40" y="318" width="200" height="34" rx="6" fill="#e2f7ff" stroke="#0070b0" stroke-width="1" class="chip"/><rect x="40" y="318" width="3" height="34" rx="0" fill="#0070b0"/><text x="52" y="338" font-family="Geist, 'Geist Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#0a0a0a">Draft v1</text><rect x="295" y="318" width="200" height="34" rx="6" fill="#e2f7ff" stroke="#0070b0" stroke-width="1" class="chip"/><rect x="295" y="318" width="3" height="34" rx="0" fill="#0070b0"/><text x="307" y="338" font-family="Geist, 'Geist Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#0a0a0a">Request approval for vN</text><rect x="550" y="318" width="200" height="50" rx="6" fill="#e2f7ff" stroke="#0070b0" stroke-width="1" class="chip"/><rect x="550" y="318" width="3" height="50" rx="0" fill="#0070b0"/><text x="562" y="338" font-family="Geist, 'Geist Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#0a0a0a">Adversarial review,</text><text x="562" y="354" font-family="Geist, 'Geist Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#0a0a0a">round N</text><path d="M905 318 L970 346 L905 374 L840 346 z" fill="#f5f5f5" stroke="#636363" stroke-width="1.2"/><text x="905" y="350" font-family="Geist, 'Geist Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#0a0a0a" text-anchor="middle">Verdict?</text><rect x="805" y="456" width="200" height="64" rx="6" fill="#e2f7ff" stroke="#0070b0" stroke-width="1" class="chip"/><rect x="805" y="456" width="3" height="64" rx="0" fill="#0070b0"/><text x="817" y="476" font-family="Geist, 'Geist Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#0a0a0a">Standoff? Rule on it</text><text x="817" y="494" font-family="Geist, 'Geist Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#636363" font-style="italic">A recurring MUST_FIX rejected</text><text x="817" y="507" font-family="Geist, 'Geist Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#636363" font-style="italic">twice running</text><rect x="550" y="456" width="200" height="34" rx="6" fill="#e2f7ff" stroke="#0070b0" stroke-width="1" class="chip"/><rect x="550" y="456" width="3" height="34" rx="0" fill="#0070b0"/><text x="562" y="476" font-family="Geist, 'Geist Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#0a0a0a">Revise to v(N+1)</text><rect x="805" y="180" width="200" height="64" rx="6" fill="#e2f7ff" stroke="#0070b0" stroke-width="1" class="chip"/><rect x="805" y="180" width="3" height="64" rx="0" fill="#0070b0"/><text x="817" y="200" font-family="Geist, 'Geist Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#0a0a0a">Corrective pass, v10</text><text x="817" y="218" font-family="Geist, 'Geist Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#636363" font-style="italic">Only when v9 still has open</text><text x="817" y="231" font-family="Geist, 'Geist Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#636363" font-style="italic">items</text><rect x="1060" y="180" width="200" height="34" rx="6" fill="#e2f7ff" stroke="#0070b0" stroke-width="1" class="chip"/><rect x="1060" y="180" width="3" height="34" rx="0" fill="#0070b0"/><text x="1072" y="200" font-family="Geist, 'Geist Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#0a0a0a">Narrow check</text><rect x="1060" y="318" width="200" height="50" rx="6" fill="#e2f7ff" stroke="#0070b0" stroke-width="1" class="chip"/><rect x="1060" y="318" width="3" height="50" rx="0" fill="#0070b0"/><text x="1072" y="338" font-family="Geist, 'Geist Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#0a0a0a">Approve the final</text><text x="1072" y="354" font-family="Geist, 'Geist Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#0a0a0a">version</text><rect x="1315" y="318" width="200" height="50" rx="6" fill="#e2f7ff" stroke="#0070b0" stroke-width="1" class="chip"/><rect x="1315" y="318" width="3" height="50" rx="0" fill="#0070b0"/><text x="1327" y="338" font-family="Geist, 'Geist Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#0a0a0a">Prune records, delete</text><text x="1327" y="354" font-family="Geist, 'Geist Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#0a0a0a">prompts, commit</text><rect x="295" y="180" width="200" height="60" rx="14" fill="none" stroke="#c20000" stroke-width="1.4" stroke-dasharray="5 3"/><text x="395" y="201" font-family="Geist, 'Geist Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#c20000" text-anchor="middle">Stop and escalate</text><text x="395" y="218" font-family="Geist, 'Geist Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#636363" text-anchor="middle" font-style="italic">Security, secrets, data loss,</text><text x="395" y="231" font-family="Geist, 'Geist Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#636363" text-anchor="middle" font-style="italic">money, legal</text><text x="40" y="560" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#9e441d">/</text><text x="52" y="560" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#9e441d" letter-spacing="0.08em">WHO DOES IT</text><text x="40" y="582" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#0a0a0a">sdd-drafter</text><text x="221" y="582" font-family="Geist, 'Geist Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#636363">writes version 1 of a document</text><text x="40" y="600" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#0a0a0a">sdd-document-orchestrator</text><text x="221" y="600" font-family="Geist, 'Geist Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#636363">runs one document phase to approval</text><text x="40" y="618" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#0a0a0a">sdd-reviewer</text><text x="221" y="618" font-family="Geist, 'Geist Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#636363">adversarial review with a verdict</text><text x="466.35" y="582" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#0a0a0a">sdd-reviser</text><text x="647.35" y="582" font-family="Geist, 'Geist Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#636363">writes the next version from the findings</text><text x="466.35" y="600" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#0a0a0a">sdd-adjudicator</text><text x="647.35" y="600" font-family="Geist, 'Geist Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#636363">rules on deadlocks, fixes what it accepts</text></svg>